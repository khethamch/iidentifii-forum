name: iidentifii-forum
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Public local demo credential; never use for a deployed environment.
      MSSQL_SA_PASSWORD: "LocalForum!2026Demo"
    ports:
      - "127.0.0.1:14339:1433"
    volumes:
      - forum-sqlserver:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q 'SELECT 1' -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  forum-sqlserver:
